services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ${TITLE:-bluebird}-app
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DEBUG=false
      - DATABASE_URL=mysql://${DB_USER:-root}:${DB_PASSWORD:-root}@mysql:3306/${DB_NAME:-blue_bird}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bluebird_net
    profiles:
      - prod

  nginx:
    image: nginx:1.27-alpine
    container_name: ${TITLE:-bluebird}-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - .:/app:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bluebird_net
    profiles:
      - prod

  mysql:
    image: mysql:8.0
    container_name: ${TITLE:-bluebird}-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-blue_bird}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance-schema=OFF
      --innodb-buffer-pool-size=64M
      --innodb-log-buffer-size=8M
      --max-connections=50
      --table-open-cache=200
      --skip-log-bin
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bluebird_net

  redis:
    image: redis:7-alpine
    container_name: ${TITLE:-bluebird}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - bluebird_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:

networks:
  bluebird_net:
    name: ${TITLE:-bluebird}_network
    driver: bridge
